services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - toqa-mongo:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/toqa
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5173
      LOW_STOCK_THRESHOLD: 5
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  toqa-mongo:
